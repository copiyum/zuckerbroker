name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # ponytail: no `playwright install` — tests lazy-import playwright, the
      # browser never runs in CI. No LLM_API_KEY — extraction tests are mocked.
      - run: ruff check househunt tests
      - run: pytest -q
