<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f0f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Find your next rental in Bangalore — scoured from Facebook housing groups, deduped, and geocoded." />
  <meta property="og:title" content="zuckerbroker" />
  <meta property="og:description" content="Rental apartment hunting for Bangalore. Map-based, deduped, broker-filtered." />
  <meta property="og:type" content="website" />
  <title>zuckerbroker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css" rel="stylesheet" />
  <script>
    /* Apply saved theme before paint to prevent flash */
    (function() {
      var t = localStorage.getItem('zb-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover"><div style="display:contents">%sveltekit.body%</div></body>
</html>
